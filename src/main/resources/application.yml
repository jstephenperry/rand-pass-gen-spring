spring:
  application:
    name: credential-generator
  main:
    banner-mode: off
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    log-request-details: false
  servlet:
    multipart:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: none
  max-http-request-header-size: 8KB
  tomcat:
    max-connections: 200
    accept-count: 100
    threads:
      max: 50
    connection-timeout: 5s
    accesslog:
      enabled: false
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
credential:
  security:
    issuer: ${CREDENTIAL_JWT_ISSUER:}
    jwk-set-uri: ${CREDENTIAL_JWT_JWK_SET_URI:}
    audience: ${CREDENTIAL_JWT_AUDIENCE:credential-generator}
    allow-insecure-http: false
  limits:
    requests-per-second: 50
    burst: 100
logging:
  level:
    root: INFO
