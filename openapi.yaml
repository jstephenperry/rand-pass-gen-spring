openapi: 3.1.0
info:
  title: Service credential generator
  version: 2.0.0
  description: Stateless credential generation. Storage, scheduling and rotation belong to callers.
paths:
  /v1/credentials:
    post:
      operationId: generateCredentials
      summary: Generate fresh cryptographically random credentials
      description: Requires scope credentials.generate. Each call produces new credentials; retries are not idempotent. Maximum body size is 1024 bytes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                byteLength:
                  type: [integer, 'null']
                  minimum: 32
                  maximum: 128
                  default: 32
                count:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 100
                  default: 1
      responses:
        '200':
          description: Fresh credentials. Never cache or log the response body.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [credentials, entropyBits, encoding]
                properties:
                  credentials:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                      type: string
                      minLength: 43
                      maxLength: 171
                      pattern: '^[A-Za-z0-9_-]+$'
                  entropyBits: {type: integer, minimum: 256, maximum: 1024, multipleOf: 8}
                  encoding: {type: string, const: base64url}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429':
          description: Instance rate limit exceeded
          headers:
            Retry-After: {schema: {type: string, const: '1'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '500': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Problem:
      type: object
      required: [type, status, title]
      properties:
        type: {type: string}
        status: {type: integer}
        title: {type: string}
        detail: {type: string}
  responses:
    Error:
      description: Request rejected or generation failed; response contains no credential material.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
